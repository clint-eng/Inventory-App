<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pest Control Inventory Manager - Sign In</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Pest Control Inventory Manager</h1>
      <p>Multi-page access for Administrator and Technician users.</p>
    </header>

    <main>
      <section class="card auth-card">
        <h2>Sign In</h2>
        <form id="login-form" class="inline-form auth-form">
          <label>Access Level
            <select id="login-role" required>
              <option value="">Select role</option>
              <option value="admin">Administrator</option>
              <option value="technician">Technician</option>
            </select>
          </label>
          <label>Email<input id="login-email" type="email" required placeholder="name@company.com" /></label>
          <label>Password<input id="login-password" type="password" required placeholder="Enter password" /></label>
          <button type="submit">Sign In</button>
        </form>
        <p class="hint">Demo passwords: admin = <code>admin123</code>, technician = <code>tech123</code>.</p>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
